#rHyprlock Configuration
# Documentation: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock

# Variables
$font = Sans

#################
### GENERAL   ###
#################

general {
    hide_cursor = false
    ignore_empty_input = false
    immediate_render = false
    text_trim = true
    fractional_scaling = 2
    screencopy_mode = 0
    fail_timeout = 2000
}

#################
### AUTH      ###
#################

auth {
    pam:enabled = true
    pam:module = hyprlock
    
    # Uncomment if you have fingerprint authentication
    # fingerprint:enabled = true
    # fingerprint:ready_message = (Scan fingerprint to unlock)
    # fingerprint:present_message = Scanning fingerprint
    # fingerprint:retry_delay = 250
}

#################
### ANIMATIONS ###
#################

animations {
    enabled = true
    
    bezier = linear, 0, 0, 1, 1
    bezier = easeInOut, 0.42, 0, 0.58, 1
    bezier = easeOut, 0, 0, 0.58, 1
    
    animation = fadeIn, 1, 0.8, easeOut
    animation = fadeOut, 1, 0.4, easeOut
    animation = inputFieldColors, 1, 0.3, easeInOut
    animation = inputFieldFade, 1, 0.2, easeOut
    animation = inputFieldWidth, 1, 0.2, easeInOut
    animation = inputFieldDots, 1, 0.2, easeOut
}

#################
### BACKGROUND ###
#################

background {
    monitor = 
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.05
}

#################
### INPUT FIELD ###
#################

input-field {
    monitor = 
    size = 400, 50
    outline_thickness = 2
    
    # Colors with gradient
    outer_color = rgba(0, 150, 255, 0.8)
    inner_color = rgba(40, 40, 40, 0.8)
    font_color = rgba(220, 220, 220, 1.0)
    
    # Status colors
    check_color = rgba(255, 165, 0, 0.8)
    fail_color = rgba(255, 69, 58, 0.8)
    capslock_color = rgba(255, 214, 10, 0.8)
    
    # Font and text
    font_family = $font
    font_size = 16
    placeholder_text = <i>Enter Password...</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    
    # Dots configuration
    dots_size = 0.3
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    
    # Behavior
    fade_on_empty = true
    fade_timeout = 2000
    rounding = 25
    
    # Position
    position = 0, -80
    halign = center
    valign = center
    zindex = 10
}

#################
### TIME      ###
#################

label {
    monitor = 
    text = $TIME
    font_size = 72
    font_family = $font
    color = rgba(255, 255, 255, 1.0)
    
    position = 0, 150
    halign = center
    valign = center
    
    # shadow_passes = 2
    # shadow_size = 3
    # shadow_color = rgba(0, 0, 0, 0.5)
}

#################
### DATE      ###
#################

label {
    monitor = 
    text = cmd[update:60000] date +"%-A, %-d %B %Y"
    font_size = 24
    font_family = $font
    color = rgba(200, 200, 200, 1.0)
    
    position = 0, 80
    halign = center
    valign = center
    
    # shadow_passes = 1
    # shadow_size = 2
    # shadow_color = rgba(0, 0, 0, 0.3)
}

#################
### USER      ###
#################

label {
    monitor = 
    text =  
    font_size = 18
    font_family = $font
    color = rgba(150, 150, 150, 1.0)
    
    position = 0, -180
    halign = center
    valign = center
}

#################
### LAYOUT    ###
#################

label {
    monitor = 
    text = $LAYOUT
    font_size = 14
    font_family = $font
    color = rgba(120, 120, 120, 1.0)
    
    position = -30, 30
    halign = right
    valign = bottom
}

#################
### SYSTEM INFO ###
#################

label {
    monitor = 
    text = cmd[update:30000] uname -r
    font_size = 12
    font_family = $font
    color = rgba(100, 100, 100, 1.0)
    
    position = 30, 30
    halign = left
    valign = bottom
}
