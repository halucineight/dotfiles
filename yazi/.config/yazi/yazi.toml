
# yazi.toml
[mgr]
show_hidden = false

[opener]
edit = [
  { run = "nvim %s", block = true, for = "unix" },
]
eog = [
{run = 'eog "$@"', orphan = true, for = "unix"},
]
mpv = [
{run = 'mpv "$@"', orphan = true, for = "unix"},
]

[open]
prepend_rules = [
    { mime = "image/*", use = [ "eog", "reveal" ] },
    { mime = "video/*", use = [ "mpv", "reveal" ] }
]

